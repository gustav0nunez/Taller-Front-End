<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="container mt-5" id="seccion-agregar">
        <div class="row justify-content-center">
            <div class="col-md-6"> 
                <div class="card shadow"> <div class="card-body">
                        <h2 class="text-center mb-4">Agregar Producto</h2>
                        
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" id="txtNombre" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <input type="text" id="txtDescripcion" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Precio</label>
                                <input type="number" id="txtPrecio" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Título</label>
                                <input type="text" id="txtTitulo" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Imágenes</label>
                                <input type="text" id="txtImagenes" class="form-control">
                            </div>
                            <button type="button" class="btn btn-primary w-100" id="btnAgregar">Agregar</button>
                        </form>
    
                    </div>
                </div>
            </div>
        </div>
    

    <div class="container mt-5" id="seccion-listado">
        <h3 class="mb-3">Listado de Productos</h3>
        
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Título</th>
                    <th>Precio</th>
                    <th>Descripción</th>
                    <th>Acciones</th> </tr>
            </thead>
            <tbody id="tabla-productos">
                </tbody>
        </table>
    </div>
 
</div>
    <script src="main.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
